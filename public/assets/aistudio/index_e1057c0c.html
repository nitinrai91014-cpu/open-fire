<title>Open Fire</title>

    html, body {

        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;

    *, *::before, *::after { box-sizing: border-box; }
    .container { max-width: 520px; margin: 0 auto; padding-bottom: 40px; touch-action: none; }
    .btn {
        background-color: #1e4682;
        color: white;
        border: none;
        padding: 16px;
        width: 100%;
        font-size: 18px;
        font-weight: bold;
        border-radius: 10px;
        margin-bottom: 12px;
        cursor: pointer;
        display: block;
        font-family: inherit;
    }
    .btn:active { transform: scale(0.99); }
    .primary { background-color: #00a86b; }
    .danger { background-color: #8b1e1e; }
    .warnbtn { background-color: #a85b00; }
    .card {
        background-color: #132238;
        border: 2px solid #1e4682;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 12px;
        line-height: 1.5;
        font-size: 16px;
    }
    .log {
        background-color: #002b18;
        color: #00ff96;
        border: 2px solid #00ff96;
        padding: 14px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-weight: bold;
        text-align: center;
        font-size: 16px;
        min-height: 60px;
    }
    .tip-box {
        background-color: #382813;
        color: #ffc864;
        border: 2px solid #ffc864;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-weight: bold;
        text-align: center;
        font-size: 15px;
    }
    .alert-box {
        background-color: #8b1e1e;
        color: #ffffff;
        border: 2px solid #ff4d4d;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-weight: bold;
        text-align: center;
        font-size: 16px;
    }
    .hint {
        background-color: #0d1c2e;
        border: 2px dashed #00a86b;
        color: #8ff0c4;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.55;
    }
    .grid { display: flex; gap: 10px; margin-bottom: 12px; }
    .grid .btn { width: 48%; flex-grow: 1; padding: 16px; font-size: 17px; margin-bottom: 0; }
    .full-width { width: 100%; }
    input[type="text"] {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        border-radius: 10px;
        border: 2px solid #1e4682;
        background: #0a0e1a;
        color: white;
        margin-bottom: 15px;
        font-family: inherit;
    }
    select {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        border-radius: 10px;
        border: 2px solid #1e4682;
        background: #0a0e1a;
        color: white;
        margin-bottom: 15px;
        font-family: inherit;
    }
    input[type="range"] { width: 100%; margin-bottom: 15px; }
    .lbl {
        display: block;
        font-size: 14px;
        color: #9fc3ff;
        margin-bottom: 6px;
        font-weight: bold;
    }
    .small { font-size: 14px; color: #9fb3d1; line-height: 1.5; }
    .center { text-align: center; }
    .badge {
        display: inline-block;
        background-color: #1e4682;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 14px;
        margin: 2px;
    }
    .divider { height: 1px; background-color: #1e4682; margin: 14px 0; }
    .hpbar {
        height: 12px;
        background: #101820;
        border-radius: 6px;
        overflow: hidden;
        margin: 8px 0 2px;
    }
    .hpbar > div {
        height: 100%;
        border-radius: 6px;
        transition: width 0.25s ease;
    }
    .hpbar.you > div { background: linear-gradient(90deg, #00c87c, #00a86b); }
    .hpbar.devil > div { background: linear-gradient(90deg, #ff6b6b, #d63333); }
    .radar {
        width: 100%;
        height: 8px;
        background: #101820;
        border-radius: 4px;
        overflow: hidden;
        margin: 6px 0;
    }
    .radar > div {
        height: 100%;
        background: linear-gradient(90deg, #00c87c, #ffc864, #ff4d4d);
        border-radius: 4px;
        transition: width 0.2s ease;
    }
</style>

var LS = {
    get: function (k, d) {
        try {
            var v = localStorage.getItem(k);
            return (v === null || v === undefined) ? d : v;
        } catch (e) { return d; }
    },
    set: function (k, v) {
        try { localStorage.setItem(k, String(v)); } catch (e) {}
    }
};

function i10(v, d) { var n = parseInt(v, 10); return isNaN(n) ? d : n; }
function f10(v, d) { var n = parseFloat(v); return isNaN(n) ? d : n; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function esc(s) {
    return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

var settings = {
    name: LS.get('of_name', ''),
    lang: LS.get('of_lang', 'en'),
    mode: LS.get('of_mode', 'buttons'),
    voiceURI: LS.get('of_voice', ''),
    rate: f10(LS.get('of_rate', '1'), 1),
    ttsVolume: f10(LS.get('of_ttsvol', '1'), 1)
};
if (settings.mode !== 'buttons' && settings.mode !== 'gestures' && settings.mode !== 'both') settings.mode = 'buttons';
if (settings.ttsVolume < 0.1 || settings.ttsVolume > 1) settings.ttsVolume = 1;
if (settings.rate < 0.5 || settings.rate > 2) settings.rate = 1;

var stats = {
    games: i10(LS.get('of_games', '0'), 0),
    wins: i10(LS.get('of_wins', '0'), 0),
    kills: i10(LS.get('of_kills', '0'), 0),
    coins: i10(LS.get('of_coins', '100'), 100),
    level: 0
};
stats.level = Math.floor(stats.wins / 10);
if (stats.level < 0) stats.level = 0;
if (stats.coins < 0) stats.coins = 0;

function saveSettings() {
    LS.set('of_name', settings.name);
    LS.set('of_lang', settings.lang);
    LS.set('of_mode', settings.mode);
    LS.set('of_voice', settings.voiceURI);
    LS.set('of_rate', settings.rate);
    LS.set('of_ttsvol', settings.ttsVolume);
}

function saveStats() {
    LS.set('of_games', stats.games);
    LS.set('of_wins', stats.wins);
    LS.set('of_kills', stats.kills);
    LS.set('of_coins', stats.coins);
    LS.set('of_level', stats.level);
}

function needWinForNext() {
    return 10 - (stats.wins % 10);
}

var AudioManager = (function () {
    var ctx = null;

    var buffers = {};
    var failed = {};
    var activeOneShots = {};
    var activeLoops = {};
    var pendingLoops = {};

    var isInitialized = false;

    function init() {
        if (isInitialized) return;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        masterGain = ctx.createGain();
        masterGain.gain.value = 1;
        masterGain.connect(ctx.destination);
        listener = ctx.listener;
        if (listener.forwardX) {
            listener.forwardX.value = 0;
            listener.forwardY.value = 0;
            listener.forwardZ.value = -1;
            listener.upX.value = 0;
            listener.upY.value = 1;
            listener.upZ.value = 0;
        } else {
            listener.setOrientation(0, 0, -1, 0, 1, 0);
        }
        isInitialized = true;
        loadAllSounds();
    }

    function unlock() {
        init();
        if (!ctx) return;
        if (ctx.state === 'suspended') {
            try { ctx.resume(); } catch (e) {}
        }
        try {
            var buffer = ctx.createBuffer(1, 1, 22050);
            var source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
        } catch (e) {}
    }

    function loadSound(key, list, index) {
        if (!ctx) return;
        if (index >= list.length) {
            failed[key] = true;
            return;

        var url = 'sounds/' + list[index];
        fetch(url)
            .then(function (res) {
                if (!res.ok) throw new Error('not ok');
                return res.arrayBuffer();

            .then(function (data) {
                return ctx.decodeAudioData(data);
            })
            .then(function (buffer) {
                buffers[key] = buffer;
                if (pendingLoops[key]) {
                    var opts = pendingLoops[key];
                    delete pendingLoops[key];
                    playLoop(key, opts);
                }
            })
            .catch(function () {
                loadSound(key, list, index + 1);
            });
    }

    function loadAllSounds() {
        for (var k in SND) {
            if (Object.prototype.hasOwnProperty.call(SND, k)) {
                loadSound(k, SND[k], 0);
            }
        }
    }

    function playHtmlFallback(key, opts) {
        opts = opts || {};
        var list = SND[key] || SND.click;
        var i = 0;
        (function attempt() {
            if (i >= list.length) return;
            var a;
            try { a = new Audio('sounds/' + list[i]); } catch (e) { i++; attempt(); return; }
            a.preload = 'auto';
            a.volume = clamp(typeof opts.volume === 'number' ? opts.volume : 1, 0, 1);
            if (opts.rate) { try { a.playbackRate = clamp(opts.rate, 0.25, 4); } catch (e) {} }
            a.addEventListener('error', function () {
                i++;
                attempt();
            }, { once: true });
            var p;
            try { p = a.play(); } catch (e) { i++; attempt(); return; }
            if (p && p.catch) {
                p.catch(function () { i++; attempt(); });
            }
        })();
    }

    function createPanner(x, y, z) {
        var panner = ctx.createPanner();
        panner.panningModel = 'HRTF';
        panner.distanceModel = 'inverse';
        panner.refDistance = 10;
        panner.maxDistance = 1000;
        panner.rolloffFactor = 1;
        panner.coneInnerAngle = 360;
        panner.coneOuterAngle = 0;
        panner.coneOuterGain = 0;
        panner.positionX.value = x || 0;
        panner.positionY.value = y || 0;
        panner.positionZ.value = z || 0;
        return panner;
    }

    function playOneShot(key, opts) {
        opts = opts || {};
        init();
        if (!ctx) {
            playHtmlFallback(key, opts);
            return;
        }
        if (!buffers[key]) {
            if (failed[key]) playHtmlFallback(key, opts);
            return;
        }
        if (opts.stopPrev !== false) stopOneShot(key);
        try {
            var source = ctx.createBufferSource();
            source.buffer = buffers[key];
            if (opts.rate) source.playbackRate.value = clamp(opts.rate, 0.25, 4);
            var gain = ctx.createGain();
            gain.gain.value = clamp(typeof opts.volume === 'number' ? opts.volume : 1, 0, 1);
            var lastNode = gain;
            if (opts.pos) {
                var panner = createPanner(opts.pos.x, opts.pos.y, opts.pos.z);
                gain.connect(panner);
                panner.connect(masterGain);
                lastNode = panner;
            } else {
                gain.connect(masterGain);
            }
            source.connect(gain);
            source.start(0);
            if (!activeOneShots[key]) activeOneShots[key] = [];
            var entry = { source: source, gain: gain, panner: lastNode };
            activeOneShots[key].push(entry);
            source.onended = function () {
                var arr = activeOneShots[key];
                if (!arr) return;
                var i = arr.indexOf(entry);
                if (i > -1) arr.splice(i, 1);
                try { source.disconnect(); } catch (e) {}
                try { gain.disconnect(); } catch (e) {}
                if (entry.panner !== gain) {
                    try { entry.panner.disconnect(); } catch (e) {}
                }
            };
        } catch (e) {}
    }

    function stopOneShot(key) {
        var arr = activeOneShots[key];
        if (!arr) return;
        for (var i = 0; i < arr.length; i++) {
            try { arr[i].source.stop(); } catch (e) {}
            try { arr[i].source.disconnect(); } catch (e) {}
            try { arr[i].gain.disconnect(); } catch (e) {}
            if (arr[i].panner !== arr[i].gain) {
                try { arr[i].panner.disconnect(); } catch (e) {}
            }
        }
        activeOneShots[key] = [];
    }

    function stopAllOneShots() {
        for (var k in activeOneShots) {
            if (Object.prototype.hasOwnProperty.call(activeOneShots, k)) {
                stopOneShot(k);
            }
        }
    }

    function playLoop(key, opts) {
        opts = opts || {};
        init();
        if (!ctx) return;
        if (!buffers[key]) {
            if (!failed[key]) pendingLoops[key] = opts;
            return;
        }
        if (activeLoops[key]) {
            var entry = activeLoops[key];
            if (opts.volume !== undefined) {
                entry.gain.gain.setTargetAtTime(clamp(opts.volume, 0, 1), ctx.currentTime, 0.06);
            }
            if (opts.rate) {
                entry.source.playbackRate.setTargetAtTime(clamp(opts.rate, 0.25, 4), ctx.currentTime, 0.06);
            }
            return;
        }
        try {
            var source = ctx.createBufferSource();
            source.buffer = buffers[key];
            source.loop = true;
            if (opts.rate) source.playbackRate.value = clamp(opts.rate, 0.25, 4);
            var gain = ctx.createGain();
            gain.gain.value = clamp(typeof opts.volume === 'number' ? opts.volume : 1, 0, 1);
            source.connect(gain);
            gain.connect(masterGain);
            source.start(0);
            activeLoops[key] = { source: source, gain: gain };
        } catch (e) {}
    }

    function stopLoop(key) {
        if (pendingLoops[key]) delete pendingLoops[key];
        var entry = activeLoops[key];
        if (!entry) return;
        try { entry.source.stop(); } catch (e) {}
        try { entry.source.disconnect(); } catch (e) {}
        try { entry.gain.disconnect(); } catch (e) {}
        delete activeLoops[key];
    }

    function stopAllLoops() {
        for (var k in activeLoops) {
            if (Object.prototype.hasOwnProperty.call(activeLoops, k)) {
                stopLoop(k);
            }
        }
    }

    function setListenerPosition(x, y, z) {
        if (!listener) return;
        if (listener.positionX) {
            listener.positionX.value = x;
            listener.positionY.value = y;
            listener.positionZ.value = z;
        } else {
            listener.setPosition(x, y, z);
        }
    }

    function startMusic(volume) {
        playLoop('music', { volume: volume || settings.ttsVolume * 0.35 });
    }

    function stopMusic() {
        stopLoop('music');
    }

    function setMusicVolume(v) {
        if (activeLoops['music']) {
            activeLoops['music'].gain.gain.value = clamp(v, 0, 1);
        }
    }

    return {
        unlock: unlock,
        playOneShot: playOneShot,
        stopOneShot: stopOneShot,
        stopAllOneShots: stopAllOneShots,
        playLoop: playLoop,
        stopLoop: stopLoop,
        stopAllLoops: stopAllLoops,
        startMusic: startMusic,
        stopMusic: stopMusic,
        setMusicVolume: setMusicVolume,
        setListenerPosition: setListenerPosition
    };
})();

function playSound(key, opts) {
    AudioManager.playOneShot(key, opts);
}

var voices = [];

function loadVoices() {
    try {
        voices = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
    } catch (e) { voices = []; }
    if (!voices) voices = [];
}

function findVoice(uri) {
    if (!uri) return null;
    for (var i = 0; i < voices.length; i++) {
        if (voices[i].voiceURI === uri) return voices[i];
    }
    return null;
}

function autoVoice() {
    var chain;
    if (settings.lang === 'ne') chain = ['ne', 'hi', 'en'];
    else if (settings.lang === 'hi') chain = ['hi', 'en'];
    else chain = ['en'];
    for (var w = 0; w < chain.length; w++) {
        for (var i = 0; i < voices.length; i++) {
            var lg = String(voices[i].lang || '').toLowerCase();
            if (lg.indexOf(chain[w]) === 0) return voices[i];
        }
    }
    return null;
}

var speechQueue = [];
var speechBusy = false;
var speechWatchdog = null;
var currentUtterance = null;

function makeUtterance(text, rate, uri) {
    var u = new SpeechSynthesisUtterance(text);
    var v = findVoice(uri) || autoVoice();
    if (v) {
        u.voice = v;
        u.lang = v.lang;
    } else {
        if (settings.lang === 'hi') u.lang = 'hi-IN';
        else if (settings.lang === 'ne') u.lang = 'ne-NP';
        else u.lang = 'en-US';
    }
    u.rate = rate || 1;
    u.volume = settings.ttsVolume;
    return u;
}

function stopSpeech() {
    speechQueue = [];
    speechBusy = false;
    currentUtterance = null;
    if (speechWatchdog) {
        clearTimeout(speechWatchdog);
        speechWatchdog = null;
    }
    if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
    }
}

function speakWith(text, rate, uri) {
    if (!text) return;
    if (!('speechSynthesis' in window)) return;
    stopSpeech();
    try {
        window.speechSynthesis.speak(makeUtterance(text, rate, uri));
    } catch (e) {}
}

function finishSpeech(u) {
    if (u && currentUtterance && u !== currentUtterance) return;
    if (speechWatchdog) {
        clearTimeout(speechWatchdog);
        speechWatchdog = null;
    }
    currentUtterance = null;
    if (!speechBusy) return;
    speechBusy = false;
    runSpeechQueue();
}

function runSpeechQueue() {
    if (speechBusy) return;
    if (speechQueue.length === 0) return;
    if (!('speechSynthesis' in window)) return;
    var text = speechQueue.shift();
    speechBusy = true;
    try {
        var u = makeUtterance(text, settings.rate, settings.voiceURI);
        currentUtterance = u;
        u.onend = function () { finishSpeech(u); };
        u.onerror = function () { finishSpeech(u); };
        var dur = 1200 + text.length * 120;
        speechWatchdog = setTimeout(function () { finishSpeech(u); }, Math.min(dur, 20000));
        window.speechSynthesis.speak(u);
    } catch (e) {
        finishSpeech(u);
    }
}

function speak(text, opts) {
    opts = opts || {};
    if (!text) return;
    if (!('speechSynthesis' in window)) return;
    if (opts.interrupt !== false) stopSpeech();
    speechQueue.push(text);
    while (speechQueue.length > 3) speechQueue.shift();
    runSpeechQueue();
}

function msg(text) {
    setLog(text);
    speak(text);
    render();
}

            html += '</div>';
            html += '<div class="grid">';
            html += '<button class="btn warnbtn" onclick="speakStatus(true)">' + t('yourStatus') + '</button>';
            html += '<button class="btn warnbtn" onclick="speakStatus(false)">' + t('enemyStatus') + '</button>';
            html += '</div>';
            html += '<button class="btn danger full-width" onclick="exitBattle()">' + t('exitGame') + '</button>';
        }
    }
    else if (screen === 'result') {
        html += '<div class="card center"><h3>' + (resultData.won ? t('victory') : t('gameOver')) + '</h3>';
        html += '<p>' + (resultData.won ? t('victoryMsg') : t('defeatMsg')) + '</p></div>';
        if (resultData.levelUp) {
            html += '<div class="tip-box">' + t('levelUp') + ' ' + t('newLevel') + ': ' + resultData.level + '</div>';
        }
        html += '<div class="card">';
        html += '<p>' + t('earned') + ': <b>' + resultData.coins + '</b></p>';
        html += '<p>' + t('hits') + ': ' + resultData.hits + ' / ' + resultData.shots + '</p>';
        html += '<p>' + t('devilShots') + ': ' + resultData.devilShots + '</p>';
        html += '<p>' + t('yourHealth') + ': ' + Math.max(0, Math.round(resultData.hp)) + '</p>';
        html += '<p>' + t('level') + ': ' + stats.level + '</p>';
        html += '<p>' + t('needWin') + ': ' + needWinForNext() + '</p>';
        html += '</div>';
        if (buttonsAllowed()) {
            html += '<button class="btn primary" onclick="playAgain()">' + t('playAgain') + '</button>';
            html += '<button class="btn danger" onclick="goMenu()">' + t('mainMenu') + '</button>';
        }
        if (gestureAllowed()) {
            html += '<div class="hint">' + t('readerUp') + ': ' + t('playAgain') + '<br>' + t('readerDown') + ': ' + t('mainMenu') + '</div>';
        }
    }

    app.innerHTML = html;
    updateAudio();
}

function devilRetreat() {
    if (game.devilState === 'retreat' || game.devilState === 'flank') return;
    if (game.devilRetreats >= MAX_DEVIL_RETREATS) return;
    game.devilState = 'retreat';
    game.devilRetreats++;
    if (game.counterTimer) {
        clearTimeout(game.counterTimer);
        game.counterTimer = null;
    }
    playSound('jump');
    msg(t('devilFled'));
    planDevil(300);
}

function devilReact() {
    if (game.devilHp <= 0) return;
    var hpPct = game.devilHp / game.devilMaxHp;
    if (hpPct < 0.55 && game.devilMedkits > 0) {
        game.devilMedkits--;
        game.devilHp = Math.min(game.devilMaxHp, game.devilHp + 60);
        playSound('medkit');
        msg(t('devilMedkit') + ' ' + t('enemyHealth') + ' ' + Math.round(game.devilHp) + '.');
        return;
    }
    if (game.devilCoverHp <= 0 && game.devilCoversLeft > 0) {
        game.devilCoversLeft--;
        game.devilCoverHp = game.devilCoverMax;
        playSound('gloowall');
        msg(t('devilCoverUp') + ' ' + t('devilCover') + ': ' + game.devilCoverHp + '.');
        return;
    }
    if (hpPct < 0.5) {
        devilRetreat();
    }
}

function step() {
    game.stepTimer = null;
    if (screen !== 'battle') return;
    if (game.devilHp <= 0 || game.playerHp <= 0) return;

    if (game.devilState === 'retreat') {
        game.distance += 14;
        if (game.distance >= 95) {
            game.distance = 95;
            game.devilState = 'flank';
            updateWalk();
            render();
            planDevil(1800 + Math.random() * 1000);
        } else {
            updateWalk();
            render();
            planDevil(350);
        }
        return;
    }

    if (game.devilState === 'flank') {
        var sp = 18 + stats.level * 0.5;
        game.distance -= sp;
        if (game.distance <= DEVIL_RANGE) {
            game.distance = DEVIL_RANGE;
            game.devilState = 'advance';
            playSound('jump');
            updateWalk();
            msg(t('devilFlank'));
            devilAttack(false);
        } else {
            updateWalk();
            render();
            planDevil(280);
        }
        return;
    }

    var prox = clamp(1 - game.distance / 100, 0, 1);
    if (game.distance > DEVIL_RANGE) {
        var speed = 7 + prox * 9 + stats.level * 0.25;
        game.distance -= speed;
        if (game.distance < DEVIL_RANGE) game.distance = DEVIL_RANGE;
        updateWalk();
        render();
        if (Math.random() < 0.14) {
            playSound('jump', { volume: 0.55 });
        }
        planDevil(Math.max(320, 800 - prox * 450));
    } else {
        AudioManager.stopLoop('walk');
        devilAttack(false);
    }
}

function devilAttack(isCounter) {
    if (screen !== 'battle') return;
    if (game.devilHp <= 0 || game.playerHp <= 0) return;

    var gunIdx = Math.floor(Math.random() * GUNS.length);
    var gun = GUNS[gunIdx];
    playSound(gun.sound, { volume: 0.9, pos: { x: 0, y: 0, z: -game.distance } });
    game.devilShots++;

    var dist = game.distance;
    var acc;
    if (dist <= 35) acc = 0.55;
    else if (dist <= 65) acc = 0.3;
    else acc = 0.1;
    if (isCounter) acc *= 0.55;
    if (game.inCover) acc *= COVER_ACC_MULT;

    var roll = Math.random();
    var outcome;
    if (roll < acc) outcome = 'hit';
    else if (roll < acc + 0.18) outcome = 'graze';
    else outcome = 'miss';

    var dealt = 0;
    if (outcome === 'hit') dealt = gun.dmg;
    else if (outcome === 'graze') dealt = Math.round(gun.dmg * 0.35);

    if (dealt > 0) {
        if (game.inCover) dealt = Math.round(dealt * COVER_DMG_MULT);
        game.playerHp -= dealt;
        game.devilDamage += dealt;
        game.devilHits++;
        playSound('damage', { volume: 1 });
        var hpShown = Math.max(0, Math.round(game.playerHp));
        var head = outcome === 'hit' ? t('youWereHit') : t('devilGrazed');
        msg(head + ' ' + t(gun.key) + '. ' + t('hitFor') + ' ' + dealt + '. ' + t('yourHealth') + ' ' + hpShown + '.');
        if (game.playerHp <= 0) {
            game.playerHp = 0;
            endGame(false);
            return;
        }
    } else {
        msg(t('devilMissed') + ' ' + t(gun.key) + '.');
    }

    if (!isCounter) {
        planDevil(1200 + Math.random() * 700);
    }
}

function devilOnHit() {
    if (screen !== 'battle' || game.devilHp <= 0 || game.playerHp <= 0) return;
    if (game.counterTimer) {
        clearTimeout(game.counterTimer);
        game.counterTimer = null;
    }
    game.counterTimer = setTimeout(function () {
        game.counterTimer = null;
        if (screen === 'battle' && game.devilHp > 0 && game.playerHp > 0) {
            devilAttack(true);
        }
    }, 280);
}

function fire() {
    if (screen !== 'battle') return;
    if (game.playerHp <= 0 || game.devilHp <= 0) return;
    if (game.devilState === 'retreat') {
        playSound('missed' in SND ? 'missed' : 'ammo');
        msg(t('missed'));
        return;
    }
    var gun = GUNS[game.gunIndex];
    if (game.ammo[game.gunIndex] <= 0) {
        playSound('ammo');
        msg(t('outOfAmmo'));
        return;
    }
    game.ammo[game.gunIndex]--;
    game.playerShots++;
    playSound(gun.sound, { pos: { x: 0, y: 0, z: 0 } });

    var prox = clamp(1 - game.distance / 100, 0, 1);
    var outcome;
    if (prox < 0.4) {
        outcome = 'miss';
    } else if (prox < 0.7) {
        var f = (prox - 0.4) / 0.3;
        var roll = Math.random();
        if (roll < 0.2 + f * 0.5) outcome = 'hit';
        else if (roll < 0.9) outcome = 'graze';
        else outcome = 'miss';
    } else {
        outcome = 'hit';
    }

    if (outcome === 'miss') {
        msg(t('missed'));
        return;
    }

    game.hitStreak++;
    var isHeadshot = (game.hitStreak % HEADSHOT_EVERY === 0);
    var dmg = outcome === 'hit' ? gun.dmg : Math.round(gun.dmg * 0.35);
    if (isHeadshot) dmg = dmg * 2;

    var brokeCover = false;
    if (game.devilCoverHp > 0) {
        dmg = Math.max(1, Math.round(dmg * 0.5));
        game.devilCoverHp--;
        if (game.devilCoverHp <= 0) {
            game.devilCoverHp = 0;
            brokeCover = true;
        }
    }
    game.devilHp -= dmg;
    game.playerHits++;
    playSound('hit', { volume: outcome === 'hit' ? 1 : 0.65 });
    playSound('enemyHit', { volume: outcome === 'hit' ? 1 : 0.65, pos: { x: 0, y: 0, z: -game.distance } });

    var shown = Math.max(0, Math.round(game.devilHp));
    var text = (outcome === 'hit' ? t('enemyHit') : t('enemyGrazed')) + ' ' + t('hitFor') + ' ' + dmg + '. ' + t('enemyHealth') + ' ' + shown + '.';
    if (isHeadshot) text += ' ' + t('headshot');
    if (brokeCover) text += ' ' + t('devilCoverDown');
    msg(text);

    if (game.devilHp <= 0) {
        game.devilHp = 0;
        endGame(true);
        return;
    }

    game.devilHitsTaken++;
    if (game.devilHitsTaken >= game.devilReactAt) {
        game.devilHitsTaken = 0;
        game.devilReactAt = 4 + (Math.random() < 0.6 ? 0 : 1);
        devilReact();
        if (game.devilHp <= 0) {
            game.devilHp = 0;
            endGame(true);
            return;
        }
    } else if (game.devilHp / game.devilMaxHp < 0.3 && game.devilState !== 'retreat' && game.devilState !== 'flank') {
        devilRetreat();
    }

    if (Math.random() < 0.15) {
        game.ammo[game.gunIndex] = Math.min(GUNS[game.gunIndex].mag, game.ammo[game.gunIndex] + 2);
        msg(t('ammoPickup'));
    }

    devilOnHit();
}

function spendCoins(amount) {
    if (stats.coins < amount) return false;
    stats.coins -= amount;
    saveStats();
    playSound('spend', { volume: 0.9 });

}

function doReload() {
    if (screen !== 'battle') return;
    if (game.ammo[game.gunIndex] >= GUNS[game.gunIndex].mag) {
        playSound('click');

        return;
    }
    if (!spendCoins(RELOAD_COST)) {
        playSound('ammo');
        msg(t('notEnough'));
        return;

    game.ammo[game.gunIndex] = GUNS[game.gunIndex].mag;
    msg(t('reloaded') + ' ' + t('coinsSpent') + ': ' + RELOAD_COST + '.');
}

function useMedkit() {
    if (screen !== 'battle') return;
    if (game.medkits <= 0) {
        playSound('ammo');
        msg(t('noMedkits'));
        return;
    }
    if (game.playerHp >= game.playerMaxHp) {
        playSound('click');
        msg(t('medkitUsed') + ' ' + Math.round(game.playerHp));
        return;
    }
    if (!spendCoins(MEDKIT_COST)) {
        playSound('ammo');
        msg(t('notEnough'));
        return;
    }
    game.medkits--;
    game.playerHp = Math.min(game.playerMaxHp, game.playerHp + 50);

    msg(t('medkitUsed') + ' ' + Math.round(game.playerHp));
}

function toggleCover() {

function endGame(won) {
    if (screen !== 'battle') return;
    stopTimer();
    AudioManager.stopLoop('walk');
    AudioManager.stopAllOneShots();

    var base = won ? 150 : 30;
    var gain = Math.round(base + game.playerHits * 10 + Math.max(0, game.playerHp) * 0.5);
    if (gain < 20) gain = 20;

    stats.coins += gain;
    stats.games++;
    if (won) {
        stats.wins++;
        stats.kills++;
    }
    var oldLevel = stats.level;
    stats.level = Math.floor(stats.wins / 10);
    if (stats.level < 0) stats.level = 0;
    var leveled = stats.level > oldLevel;
    saveStats();

    resultData = {
        won: won,
        coins: gain,
        hits: game.playerHits,
        shots: game.playerShots,
        devilShots: game.devilShots,
        hp: game.playerHp,
        levelUp: leveled,
        level: stats.level
    };
    screen = 'result';
    render();
    playSound(won ? 'win' : 'lose');
    var speech = won ? t('victoryMsg') : t('defeatMsg');
    speech += ' ' + t('earned') + ' ' + gain + '.';
    if (leveled) speech += ' ' + t('newLevel') + ' ' + stats.level + '.';
    speak(speech);
}

function playAgain() {
    AudioManager.stopAllOneShots();
    stopSpeech();
    playSound('click');
    resetGame();

    setLog(t('jumpMsg'));
    render();
    AudioManager.playLoop('airplane', { volume: settings.ttsVolume * 0.4 });
    speak(t('jumpMsg'));
}

function handleGesture(dir, fingers) {
    if (!gestureAllowed()) return;
    if (screen === 'welcome' || screen === 'menu' || screen === 'settings' || screen === 'guide' || screen === 'profile' || screen === 'about') return;
    if (screen === 'reader') {
        if (dir === 'up') continueToJump();
        else if (dir === 'down') goMenu();
        return;
    }
    if (screen === 'jump') {
        if (dir === 'up') doJump();
        else if (dir === 'down') handleBack();
        return;
    }
    if (screen === 'para') {
        if (dir === 'up') doPara();
        else if (dir === 'down') handleBack();
        return;
    }
    if (screen === 'land') {
        if (dir === 'up') doLand();
        else if (dir === 'down') handleBack();
        return;
    }
    if (screen === 'battle') {
        if (fingers >= 3) {
            if (dir === 'up') toggleCover();
            else if (dir === 'down') exitBattle();
            return;
        }
        if (fingers === 2) {
            if (dir === 'up') doReload();
            else if (dir === 'down') useMedkit();
            else if (dir === 'right') speakStatus(true);
            else if (dir === 'left') speakStatus(false);
            return;
        }
        if (dir === 'up') fire();
        else if (dir === 'down') doReload();
        else if (dir === 'right') switchGun(1);
        else if (dir === 'left') switchGun(-1);
        return;
    }
    if (screen === 'result') {
        if (dir === 'up') playAgain();
        else if (dir === 'down') goMenu();
        return;
    }
}

var gesture = {
    active: {},
    maxFingers: 0,
    accDx: 0,
    accDy: 0,
    maxDelta: 0,
    bestDx: 0,
    bestDy: 0
};

var suppressClick = false;

function resetGesture() {
    gesture.active = {};
    gesture.maxFingers = 0;
    gesture.accDx = 0;
    gesture.accDy = 0;
    gesture.maxDelta = 0;
    gesture.bestDx = 0;
    gesture.bestDy = 0;
}

function onTouchStart(e) {
    AudioManager.unlock();
    if (Object.keys(gesture.active).length === 0) {
        gesture.maxFingers = 0;
        gesture.accDx = 0;
        gesture.accDy = 0;
        gesture.maxDelta = 0;
        gesture.bestDx = 0;
        gesture.bestDy = 0;
    }
    if (e.touches.length > gesture.maxFingers) gesture.maxFingers = e.touches.length;
    for (var i = 0; i < e.changedTouches.length; i++) {
        var tc = e.changedTouches[i];
        if (!gesture.active[tc.identifier]) {
            gesture.active[tc.identifier] = { sx: tc.clientX, sy: tc.clientY };
        }
    }
}

function onTouchMove(e) {
    if (e.touches.length > gesture.maxFingers) gesture.maxFingers = e.touches.length;
}

function onTouchEnd(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
        var tc = e.changedTouches[i];
        var s = gesture.active[tc.identifier];
        if (s) {
            var dx = tc.clientX - s.sx;
            var dy = tc.clientY - s.sy;
            gesture.accDx += dx;
            gesture.accDy += dy;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d > gesture.maxDelta) {
                gesture.maxDelta = d;
                gesture.bestDx = dx;
                gesture.bestDy = dy;
            }
            delete gesture.active[tc.identifier];
        }
    }
    if (e.touches.length === 0) {
        var fingers = gesture.maxFingers || 1;
        var threshold = fingers >= 2 ? 24 : 32;
        if (gesture.maxDelta >= threshold) {
            var ax = Math.abs(gesture.bestDx);
            var ay = Math.abs(gesture.bestDy);
            var dir;
            if (ax >= ay) dir = gesture.bestDx > 0 ? 'right' : 'left';
            else dir = gesture.bestDy > 0 ? 'down' : 'up';
            suppressClick = true;
            setTimeout(function () { suppressClick = false; }, 650);
            handleGesture(dir, fingers);
        }
        resetGesture();
    }
}

function onTouchCancel(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
        delete gesture.active[e.changedTouches[i].identifier];
    }
    if (e.touches.length === 0) resetGesture();
}

document.addEventListener('touchstart', onTouchStart, { passive: true });
document.addEventListener('touchmove', onTouchMove, { passive: true });
document.addEventListener('touchend', onTouchEnd, { passive: true });
document.addEventListener('touchcancel', onTouchCancel, { passive: true });

document.addEventListener('mousedown', function () {
    AudioManager.unlock();
}, { passive: true });

document.addEventListener('keydown', function (e) {
    AudioManager.unlock();
    if (!gestureAllowed()) return;
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    var d = map[e.key];
    if (!d) return;
    var fingers = 1;
    if (e.shiftKey) fingers = 2;
    if (e.altKey || e.ctrlKey) fingers = 3;
    e.preventDefault();
    handleGesture(d, fingers);
});

document.addEventListener('click', function (e) {
    if (suppressClick) {
        suppressClick = false;
        e.stopPropagation();
        e.preventDefault();
        return;
    }
    AudioManager.unlock();
    updateAudio();
}, true);

if ('speechSynthesis' in window) {
    try {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = function () {
            loadVoices();
            if (screen === 'settings') render();
        };
    } catch (e) {}
}

AudioManager.unlock();
render();
</script>
